# nascli 配置示例：复制为 config.toml 后填写真实值。
# CLI 只读取一个 TOML 文件；默认是当前目录的 config.toml，
# 也可以用 `nascli --config <path> ...` 指定其他文件。

host = "nas.example.com"   # 必填：主机名或 IP，不要带协议、路径或端口
port = 9443                # 可选，默认 9443
token = "ugpoa_v1...."     # 必填：NAS 访问令牌
insecure = true            # 可选，默认 true（接受自签名证书）
