[package]
name = "nascli"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "CLI for UGOS Pro OpenCLI access-token API"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
